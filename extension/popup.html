<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 260px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        padding: 12px;
        color: #17181c;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      label {
        display: block;
        margin-bottom: 4px;
        color: #555;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px;
        margin-bottom: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        width: 100%;
        padding: 8px;
        background: #ff8c1a;
        border: none;
        border-radius: 4px;
        font-weight: 700;
        cursor: pointer;
      }
      #status {
        margin-top: 8px;
        font-size: 12px;
        color: #4a4a4a;
      }
      p {
        color: #666;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <h1>Card ID (Free) — Settings</h1>
    <label for="backendUrl">Backend URL</label>
    <input id="backendUrl" type="text" placeholder="https://your-project.vercel.app/api/identify" />
    <button id="save">Save</button>
    <div id="status"></div>
    <p>Go to a live Whatnot stream to see the Card ID panel in the bottom-right corner.</p>
    <script src="popup.js"></script>
  </body>
</html>
